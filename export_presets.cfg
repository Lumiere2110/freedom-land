; Godot の「書き出し(エクスポート)」の設定です。
; Windows 用の exe を export/FreedomLand.exe に作ります。
; ゲームのデータ(pck)は exe の中に入れるので、exe ファイル1つで遊べます。

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="export/FreedomLand.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Freedom Land"
application/file_description="みんなで遊べる3Dミニゲーム集"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
