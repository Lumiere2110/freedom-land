; Godot の「書き出し(エクスポート)」の設定です。
; Windows 用の exe を export/FreedomLand.exe に作ります。
; ゲームのデータ(pck)は exe の中に入れるので、exe ファイル1つで遊べます。

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="export/FreedomLand.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Freedom Land"
application/file_description="みんなで遊べる3Dミニゲーム集"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

; ブラウザ版(スマホでも遊べる)。docs/index.html に作り、GitHub Pages で公開します。
; GitHub Pages は特別な設定(COOP/COEP)ができないので、スレッドを使わない版にしています。

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/webrtc_native/*"
export_path="docs/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
; スマホでパスワードを入れるときに、画面のキーボードを出す
html/experimental_virtual_keyboard=true
; アプリとして入れられるようにする(PWA)。iPhone は Safari の「共有 → ホーム画面に追加」
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.105882, 0.121569, 0.290196, 1)
